<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image — AI Barangay Problem Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f6ed;
    --dark: #0e4c41;
    --teal: #2ba889;
    --sage: #dcebdd;
    --text-3: #8a948c;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; position: relative; font-family: var(--mono); }

  .frame {
    position: absolute;
    inset: 48px 56px;
    display: flex;
    flex-direction: column;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 15px;
    letter-spacing: 0.18em;
    color: var(--dark);
    font-weight: 600;
  }
  .top .sub { color: var(--text-3); }

  .headline {
    margin-top: 74px;
    font-family: var(--display);
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--dark);
  }
  .headline .accent { color: var(--teal); }

  .lede {
    margin-top: 40px;
    max-width: 600px;
    font-family: var(--body);
    font-size: 19px;
    line-height: 1.65;
    color: #3f4b47;
  }
  .lede b { color: var(--dark); font-weight: 600; }

  .bottom {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .brand {
    font-size: 14px;
    letter-spacing: 0.18em;
    color: var(--text-3);
  }
  .brand strong { color: var(--dark); font-weight: 600; }

  /* Street-line motif, bottom right */
  .map { display: block; }
  .map .street { fill: none; stroke: var(--dark); stroke-width: 1.5; opacity: 0.16; }
  .map .primary { stroke: var(--teal); stroke-width: 2.5; opacity: 0.5; }
  .map .boundary { fill: none; stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 6 7; opacity: 0.45; }
  .map .pt { fill: var(--teal); }
  .map .ring { fill: none; stroke: var(--teal); stroke-width: 1.5; opacity: 0.65; }
  .map .v { fill: var(--sage); stroke: var(--green-deep, #1e7d66); stroke-width: 2; }
  .map .chk { fill: none; stroke: #1e7d66; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <span>AI BARANGAY PROBLEM MAPPER</span>
      <span class="sub">SAN ISIDRO BARANGAY • LOCAL GOVERNMENT UNIT</span>
    </div>

    <div class="headline">
      COMMUNITY PROBLEMS.<br />
      <span class="accent">SMARTER RESPONSE.</span>
    </div>

    <div class="lede">
      Report community problems, track their progress, and help your
      barangay respond with better information.
    </div>

    <div class="bottom">
      <span class="brand"><strong>AI BARANGAY</strong> PROBLEM MAPPER</span>
      <svg class="map" width="300" height="130" viewBox="0 0 300 130" aria-hidden="true">
        <path class="street primary" d="M -10 100 C 60 80, 110 40, 180 30 S 260 20, 310 40" />
        <path class="street" d="M 40 140 C 90 100, 160 90, 230 60 S 290 20, 320 10" />
        <path class="street" d="M 120 140 C 150 110, 210 100, 250 80 S 300 60, 320 50" />
        <path class="boundary" d="M 150 34 L 226 22 L 268 52 L 258 96 L 196 108 L 158 78 Z" />
        <circle class="pt" cx="180" cy="48" r="4" />
        <circle class="pt" cx="238" cy="84" r="4" />
        <circle class="ring" cx="207" cy="64" r="22" />
        <circle class="v" cx="222" cy="42" r="8" />
        <path class="chk" d="M 218.5 42 l 2.5 2.5 l 5 -5" />
      </svg>
    </div>
  </div>
</body>
</html>
